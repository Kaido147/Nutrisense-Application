<!DOCTYPE html>

<html class="light" lang="en"><head>

                    spacing: {

                        "gutter": "16px"

                    fontFamily: {

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-gutter py-4 w-full docked full-width top-0 sticky z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-highest border-2 border-primary-container/10">
<img alt="User profile photo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ujfI-2WuhCtW44So8pvJEzFIsJfBk3h2feKqNJr8OktB9YYEeLA96itiaLaV332cTd9mdgxQ28pflUznagkjCrxuGT93O5itAHCTSQJjLL11LaRBOovyzcFbj6ouFtR_odC8a6L_SsSEIjF6MgTta179sskpvv40evB3fdHSR9bTb9neXlxJuflXV0AyUSg_iwnQG-Mr3zGvOBxkSlHDY_rKeRzzYQrFV1J8VgZmFXAh6rlMXrO2C0SB4-WtU_R7hZ-lIC7csNQ"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">Wellness Hub</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding py-6 flex flex-col gap-section-gap pb-32 max-w-2xl mx-auto w-full">
<!-- Header -->
<div>
<h2 class="font-headline-xl text-headline-xl text-primary mb-2">Log Workout</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Record your recent activity and track your progress.</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-stack-gap bg-surface-container-lowest p-6 rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)]">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Workout Name</label>
<input class="w-full bg-surface border-0 rounded-full px-6 py-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary-container transition-all placeholder:text-outline-variant shadow-inner" placeholder="Morning Run" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Workout Type</label>
<div class="relative">
<select class="w-full bg-surface border-0 rounded-full px-6 py-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary-container transition-all appearance-none shadow-inner">
<option>Strength Training</option>
<option>Cardio</option>
<option>Yoga / Flexibility</option>
<option>HIIT</option>
<option>Other</option>
</select>
<span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Date</label>
<div class="relative">
<input class="w-full bg-surface border-0 rounded-full px-6 py-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary-container transition-all shadow-inner" type="date"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-2">Duration (min)</label>
<input class="w-full bg-surface border-0 rounded-full px-6 py-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary-container transition-all placeholder:text-outline-variant shadow-inner" placeholder="45" type="number"/>
</div>
</div>
</div>
<!-- Intensity Level -->
<div class="flex flex-col gap-4">
<h3 class="font-headline-md text-headline-md text-primary ml-2">Intensity Level</h3>
<div class="flex bg-surface-container-lowest p-2 rounded-full shadow-[0px_4px_20px_rgba(0,0,0,0.05)] w-full">
<button class="flex-1 py-3 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface transition-colors">Light</button>
<button class="flex-1 py-3 rounded-full font-label-md text-label-md bg-secondary-container text-primary-container shadow-sm transition-all">Moderate</button>
<button class="flex-1 py-3 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface transition-colors">Intense</button>
</div>
</div>
<!-- Exercises / Sets -->
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end ml-2 mr-2">
<h3 class="font-headline-md text-headline-md text-primary">Exercises</h3>
<button class="text-primary font-label-md text-label-md flex items-center gap-1 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]">add</span> Add
                </button>
</div>
<div class="flex flex-col gap-3">
<!-- Exercise Item -->
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill">fitness_center</span>
</div>
<div>
<h4 class="font-label-md text-label-md text-on-surface">Bench Press</h4>
<p class="font-body-md text-[14px] text-on-surface-variant">3 sets × 10 reps</p>
</div>
</div>
<button class="text-outline-variant hover:text-error transition-colors p-2 rounded-full hover:bg-error-container">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Exercise Item -->
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill">directions_run</span>
</div>
<div>
<h4 class="font-label-md text-label-md text-on-surface">Treadmill Sprint</h4>
<p class="font-body-md text-[14px] text-on-surface-variant">15 mins • 2.5 km</p>
</div>
</div>
<button class="text-outline-variant hover:text-error transition-colors p-2 rounded-full hover:bg-error-container">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</div>
<!-- Notes -->
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background/90 backdrop-blur-md shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] z-50 max-w-2xl mx-auto flex gap-4 pb-safe">
<button class="flex-1 py-4 px-6 rounded-full border border-primary text-primary font-label-md text-label-md hover:bg-primary-fixed/20 transition-colors text-center">
            Cancel
        </button>
<button class="flex-[2] py-4 px-6 rounded-full bg-[#DDBE7B] text-primary-container font-label-md text-label-md font-bold hover:opacity-90 transition-opacity shadow-md text-center">
            Log Workout
        </button>
</div>
</body></html>
